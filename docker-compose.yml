services:
    cardsmp:
        build:
            context: .
        container_name: cardsmp
        restart: unless-stopped
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: 8000
            FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://cardsmp.github.io}
        expose:
            - "8000"
        networks:
            - web

networks:
    web:
        external: true
